name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # Instrument every package so cross-package tests (e.g. the matcher
        # driving the core) are credited; the threshold check excludes
        # generated mocks and demo example mains via .testcoverage.yml.
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609 # v2.18.8
        with:
          config: ./.testcoverage.yml

      - name: Smoke-run examples
        run: |
          go run ./examples/01_basic
          go run ./examples/02_lifecycle_hooks
          go run ./examples/03_subject_pattern
          go run ./examples/04_nested_transactions
