name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          # Count coverage across the whole library so cross-package tests
          # (e.g. matcher driving the core) are credited. Exclude generated
          # mocks and the demo example mains, which aren't unit-tested.
          COVERPKG=$(go list ./... | grep -vE '/mocks$|/examples/' | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage threshold
        run: |
          THRESHOLD=90.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total library coverage: ${total}% (minimum ${THRESHOLD}%)"
          awk -v t="$THRESHOLD" -v c="$total" 'BEGIN { exit (c+0 < t+0) ? 1 : 0 }' \
            || { echo "::error::coverage ${total}% is below the ${THRESHOLD}% threshold"; exit 1; }

      - name: Smoke-run examples
        run: |
          go run ./examples/01_basic
          go run ./examples/02_lifecycle_hooks
          go run ./examples/03_subject_pattern
          go run ./examples/04_nested_transactions
